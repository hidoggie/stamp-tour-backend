<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>경품 룰렛 게임</title>
    <style>
        body { 
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, 'Helvetica Neue', 'Segoe UI', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif;
            background-color: #111827; margin: 0;  font-size: 14px; line-height: 1.5;
            text-align: center; 
            color: white; 
            padding-top: 1em; }
        h1 { color: #e43f5a; }
        p { font-size: 1.1em; }
        .roulette-container { position: relative; width: 350px; height: 350px; margin: 20px auto; }
        #canvas { display: block; }
        .pointer { 
            position: absolute; 
            top: -20px; 
            left: 50%; 
            transform: translateX(-50%); 
            width: 0; height: 0; 
            border-left: 1.5em solid transparent; 
            border-right: 1.5em solid transparent; 
            border-top: 2em solid #facc15; 
            z-index: 10; }
        #spin_button { 
            font-size: 1.2em; 
            padding: 16px 30px; 
            border-radius: 8px; 
            border: none; 
            cursor: pointer; 
            background-color: #ca8a04;; 
            color: white; 
            margin-top: 1.25em;
            margin-bottom: 1.25em; 
            transition: background-color 0.2s; }
        #spin_button:disabled { background-color: #555; cursor: not-allowed; }
        #back_button { 
            font-size: 1.2em; 
            padding: 16px 30px; 
            border-radius: 8px; 
            border: none; 
            cursor: pointer; 
            background-color: #ca8a04;; 
            color: white; 
            margin-top: 20px; 
            transition: background-color 0.2s; }
        #back_button:disabled { background-color: #555; cursor: not-allowed; }

        .hidden { display: none; }

        .highlight {
            color: #fcd34d;
            font-size: 1.4em;
            font-weight: bold;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%   { opacity: 1; }
            50%  { opacity: 0; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>
    <div style="margin-top: 16px; margin-bottom: 24px; text-align: center; ">
      <h1 style="color: #ffffff; margin-bottom: 8px; font-size: 2.2em; ">🎯 상품 룰렛</h1>
      <div id="info" style="font-size: 2em; margin-bottom: 8px; text-align: center; color: #fcd34d;; margin-bottom: 8px; " class="hidden">🎉 축하합니다!</div>
      <div id="info1" style="color: #e5e7eb;; font-size:18px; " class="hidden">태양계 5개 행성 스탬프를 모두 수집했습니다!</div>
    </div>

    <div style="max-width: 448px; margin: 0 auto; margin-bottom: 24px; background-color: #1f2937; border: 1px solid #4b5563; border-radius: 12px; backdrop-filter: blur(8px);">
        <div class="roulette-container hidden" id="roulette-Container">
            <div class="pointer"></div>
            <canvas id="canvas" width="350" height="350"></canvas>
        </div>
        <button id="spin_button" disabled class="hidden">🎰 룰렛 돌리기</button>
        <!--button id="back_button" onclick="location.href='./joayong-map.html'" disabled class="hidden">🗺️ 메인 페이지로 이동</button-->
        <button id="back_button" disabled class="hidden">🗺️ 메인 페이지로 이동</button>
    </div>

    <script src="./js/TweenMax.min.js"></script>
    <script src="./js/Winwheel.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const spinButton = document.getElementById('spin_button');
            const RContainer = document.getElementById('roulette-Container');
            const InfoBox = document.getElementById('info');
            const InfoBox1 = document.getElementById('info1');
            const backButton = document.getElementById('back_button');
            let theWheel;
            let wheelSpinning = false;
            let eventConfig; // 현재 이벤트의 규칙을 저장할 변수


            const urlParams = new URLSearchParams(window.location.search);
            const eventId = urlParams.get('event_id');

            // 1. 사용자 ID를 먼저 확인합니다.
            const userId = localStorage.getItem('userId');
            if (!userId) {
                alert("사용자 정보를 찾을 수 없어 메인 화면으로 돌아갑니다.");
                window.location.href = 'joayong-map.html';
                return; // ID가 없으면 스크립트 실행을 즉시 중단합니다.
            }
            console.log(`사용자 ID 확인: ${userId}`);

            // 2. 룰렛 게임의 모든 로직을 담는 메인 함수
            async function initializeGame() {
                try {
                    // 3. 서버에 룰렛 참여 자격 확인
                    const configResponse = await fetch(`/api/event-config/${eventId}`);
                    const eventConfig = await configResponse.json();
                    if (!eventConfig || !eventConfig.main_page_url) {
                        throw new Error('이벤트 설정 정보를 찾을 수 없습니다.');
                    }
                
                // "메인으로" 버튼에 DB에서 가져온 URL 설정
                    backButton.onclick = () => { window.location.href = eventConfig.main_page_url; };

                    const eligibilityResponse = await fetch(`/api/check-eligibility/${userId}?event_id=${eventId}`);
                    const eligibility = await eligibilityResponse.json();

                    if (!eligibility.eligible) {
                        alert(eligibility.reason || "룰렛에 참여할 자격이 없습니다.");
                        if(eligibility.reason == "이미 경품을 수령했습니다.") {
                            spinButton.classList.remove('hidden'); 
                            spinButton.textContent = "참여 완료";
                            spinButton.disabled = true;

                            backButton.classList.remove('hidden');
                            backButton.disabled = false;                          
                        }
                        else {
                            backButton.classList.remove('hidden');
                            backButton.disabled = false;
                            spinButton.classList.add('hidden'); // 스핀 버튼은 숨김
                        }
                        return;
                    }
                    else {
                        InfoBox.classList.remove('hidden');
                        InfoBox1.classList.remove('hidden'); 
                        RContainer.classList.remove('hidden'); 
                        spinButton.classList.remove('hidden'); 
                        backButton.classList.remove('hidden');
                        backButton.disabled = false; // 이제 메인으로 돌아갈 수 있음
                    }
 
                    // 4. 경품 정보를 가져와 룰렛 생성
                    const prizesResponse = await fetch(`/api/prizes?event_id=${eventId}`);
                    const prizes = await prizesResponse.json();
                                    
                    if (!prizes || prizes.length === 0) throw new Error("남아있는 경품이 없습니다.");
                    
                    const totalQuantity = prizes.reduce((sum, p) => sum + p.remaining_quantity, 0);
                    if (totalQuantity === 0) throw new Error("모든 경품이 소진되었습니다.");

                    const colors = ['#ef4444', '#3b82f6', '#22d3ee'];  //빨강, 파랑, 민트
    //                const colorIndex = index % 3;

                    const segments = prizes.map((p, index) => ({
    //                    'fillStyle': index % 2 === 0 ? '#1f4068' : '#162447',
                        'fillStyle': colors[index % 3],
                        'text': p.name,
                        'size': (p.remaining_quantity / totalQuantity) * 360,
                        'prizeId': p.id
                    }));

                    theWheel = new Winwheel({
                        'centerX': 175,
                        'centerY': 175,
                        'canvasId': 'canvas', 
                        'numSegments': segments.length, 
                        'outerRadius': 170,
                        'textFontSize': 24, 
                        'textFillStyle': 'white', 
                        'segments': segments,
                        'textOrientation' : 'horizontal', 
                        'textAlignment' : 'outer',
                        'lineWidth': 2,
                        'lineColor': '#FFD700',
                        'animation': { 'type': 'spinToStop', 'duration': 8, 'spins': 10 },
                    });
                    
                    theWheel.draw();
                    spinButton.textContent = "🎰 룰렛 돌리기";
                    spinButton.disabled = false;
                } catch (error) {
                    alert(error.message);
                    spinButton.textContent = "오류 발생";
                    backButton.classList.remove('hidden'); // 오류 시에도 돌아갈 수 있도록
                    backButton.disabled = false;
                }
            }

            spinButton.onclick = async () => {
                if (wheelSpinning) return;
                spinButton.disabled = true;
                wheelSpinning = true;
                backButton.disabled = true; // 돌리는 중에는 이동 방지

                try {
                    const response = await fetch('/api/spin', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ userId: userId, event_id: eventId })
                    });
                    const result = await response.json();
                    if (result.error) throw new Error(result.error);

                    theWheel.animation.stopAngle = result.stopAt;
                    theWheel.animation.callbackFinished = () => {
                        alert(`축하합니다! '${result.prizeName}'에 당첨되었습니다!`);
                        wheelSpinning = false;
                        spinButton.innerHTML = "<span class='highlight'>🎁 " + result.prizeName + "</span> 에 당첨되었습니다.";
                        document.querySelector('p').textContent = "부스에서 화면을 보여주고 경품을 수령하세요!";
                        backButton.disabled = false; // 이제 이동 가능
                    };
                    theWheel.startAnimation();
                } catch (error) {
                    alert(`룰렛을 돌리는 중 오류가 발생했습니다: ${error.message}`);
                    wheelSpinning = false;
                    spinButton.disabled = false;
                    backButton.disabled = false;
                }
            };

            // 5. Winwheel 라이브러리가 준비되면 게임 초기화 시작
            const checkLibrary = setInterval(() => {
                if (typeof Winwheel !== 'undefined' && typeof TweenMax !== 'undefined') {
                    clearInterval(checkLibrary);
                    initializeGame();
                }
            }, 100);
        });
    </script>
</body>

</html>
