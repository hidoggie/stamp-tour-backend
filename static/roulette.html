<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>경품 룰렛 및 교환권</title>
    <link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@500;700;900&display=swap" rel="stylesheet">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="./js/Winwheel.min.js"></script>
    <script src="./js/joayong.js"></script>

    <style>
        body {
            margin: 0; background: #F7FBFF; font-family: "Noto Sans KR", sans-serif;
            display: flex; flex-direction: column; align-items: center; 
            min-height: 100vh; overflow-x: hidden;
        }

        .hidden { display: none !important; }
        
        /* =========================================
           1. 룰렛 화면 스타일 (이전의 화려한 노란색 디자인 복구)
           ========================================= */
        #screen-roulette {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            width: 100%; flex: 1; padding: 20px; box-sizing: border-box;
        }
        
        #screen-roulette h1 { font-family: "Jua", sans-serif; color: #0441E6; margin-bottom: 5px; font-size: 36px; text-shadow: 2px 2px 0 #FFF; letter-spacing: 1px; }
        #screen-roulette p { color: #5A6579; margin-bottom: 20px; font-weight: 700; }

        /* 룰렛 전체 래퍼 (테두리 및 전구 효과) */
        .roulette-wrapper {
            position: relative; width: 320px; height: 320px;
            background: #FFD429; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2), inset 0 6px 15px rgba(255,255,255,0.6);
            border: 8px solid #F8B400;
        }
        /* 테두리의 반짝이는 전구 느낌 */
        .roulette-wrapper::before {
            content: ''; position: absolute; inset: 5px;
            border-radius: 50%; border: 8px dotted #FFF8D6; z-index: 1;
        }
        
        /* 실제 캔버스가 들어가는 영역 */
        .canvas-container {
            position: relative; z-index: 2; width: 270px; height: 270px;
            border-radius: 50%; overflow: hidden;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.15); background: #fff;
        }
        canvas { width: 100%; height: 100%; }

        /* 중앙 핀(포인터) - 빨간 마커 형태 */
        .pointer {
            position: absolute; top: -25px; left: 50%; transform: translateX(-50%);
            width: 36px; height: 48px; background: #E63946;
            clip-path: polygon(50% 100%, 0 0, 100% 0); z-index: 10;
        }
        
        /* 룰렛 중앙의 빨간 원 */
        .inner-circle {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 35px; height: 35px; background: #E63946;
            border-radius: 50%; border: 5px solid #FFD429; z-index: 5;
            box-shadow: 0 3px 6px rgba(0,0,0,0.3);
        }

        /* 하단 받침대 (스탠드) */
        .stand {
            width: 80px; height: 30px; background: #F8B400;
            margin: -10px auto 0; position: relative; z-index: 0;
            clip-path: polygon(20% 0, 80% 0, 100% 100%, 0% 100%);
        }
        .stand-base {
            width: 140px; height: 15px; background: #FFD429;
            margin: 0 auto 10px; border-radius: 8px;
            box-shadow: 0 5px 10px rgba(0,0,0,0.1);
        }

        /* 당첨 결과 텍스트 */
        .result-text {
            font-size: 26px; font-weight: 900; color: #0441E6; margin-top: 10px; margin-bottom: 20px;
            opacity: 0; transition: opacity 0.5s ease; height: 35px;
        }
        .result-text.show { opacity: 1; }

        .spin-btn {
            width: 100%; max-width: 320px; padding: 18px; border-radius: 999px; border: none;
            background: linear-gradient(145deg, #00B3FF, #0441E6); color: white;
            font-size: 22px; font-weight: 900; cursor: pointer;
            box-shadow: 0 8px 20px rgba(4, 65, 230, 0.3); transition: all 0.2s;
        }
        .spin-btn:active { transform: scale(0.95); }
        .spin-btn:disabled { background: #ccc; box-shadow: none; cursor: not-allowed; }

        /* =========================================
           2. 교환권 화면 스타일
           ========================================= */
        #screen-ticket {
            display: flex; flex-direction: column; align-items: center; 
            width: 100%; max-width: 400px; padding: 30px 20px; box-sizing: border-box; flex: 1;
        }
        .ticket-title { width: 100%; text-align: left; font-size: 20px; font-weight: 900; margin-bottom: 30px; }
        
        .ticket-box {
            position: relative; width: 100%; background: #fff;
            border: 3px solid #3457F1; border-radius: 20px;
            padding: 30px 20px; box-sizing: border-box;
            box-shadow: 0 15px 35px rgba(52, 87, 241, 0.1);
        }
        .cutout-left, .cutout-right {
            position: absolute; top: 155px; width: 16px; height: 32px;
            background: #F7FBFF; border: 3px solid #3457F1;
        }
        .cutout-left { left: -3px; border-radius: 0 20px 20px 0; border-left: none; transform: translateY(-50%); }
        .cutout-right { right: -3px; border-radius: 20px 0 0 20px; border-right: none; transform: translateY(-50%); }

        .ticket-top-row { display: flex; justify-content: space-between; color: #7A8496; font-size: 13px; font-weight: 700; margin-bottom: 15px; }
        .ticket-prize { font-size: 34px; font-weight: 900; color: #111; margin: 0 0 5px 0; }
        .ticket-desc { font-size: 14px; color: #7A8496; font-weight: 600; margin-bottom: 25px; }
        
        .ticket-divider { border-top: 2px dashed #A3B5F7; margin: 0 -20px 25px; }

        .ticket-code-label { text-align: center; font-size: 13px; color: #7A8496; font-weight: 700; margin-bottom: 5px; }
        .ticket-code { text-align: center; font-family: "Bagel Fat One", sans-serif; font-size: 36px; color: #3457F1; margin-bottom: 30px; letter-spacing: 2px;}
        
        .ticket-bottom-row { display: flex; justify-content: space-between; color: #7A8496; font-size: 13px; font-weight: 700; }

        .warning-box {
            background: #EEF6FF; border-radius: 12px; padding: 16px; margin-top: auto;
            color: #5A6579; font-size: 13.5px; font-weight: 600; line-height: 1.5;
            width: 100%; box-sizing: border-box; margin-bottom: 15px; border: 1px solid #D6E9F7;
        }
        .btn-home {
            width: 100%; padding: 18px; border-radius: 16px; border: none;
            background: #EEF1F6; color: #3D4759; font-size: 18px; font-weight: 800; cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- 1. 룰렛 화면 -->
    <div id="screen-roulette">
        <h1>행운의 조아용 룰렛</h1>
        <p>가운데 버튼을 눌러 경품을 확인하세요!</p>

        <div class="roulette-wrapper">
            <div class="pointer"></div>
            <div class="canvas-container">
                <canvas id="canvas" width="270" height="270"></canvas>
            </div>
            <div class="inner-circle"></div>
        </div>
        
        <div class="stand"></div>
        <div class="stand-base"></div>

        <div id="result-text" class="result-text">키링 당첨!</div>

        <button id="btn-action" class="spin-btn">돌리기!</button>
    </div>

    <!-- 2. 교환권 화면 -->
    <div id="screen-ticket" class="hidden">
        <div class="ticket-title">당첨 상품 교환권</div>
        
        <div class="ticket-box">
            <div class="cutout-left"></div>
            <div class="cutout-right"></div>
            
            <div class="ticket-top-row">
                <span>2026 용인시 조아용 축제</span>
                <span>AR 스탬프투어</span>
            </div>
            <h2 id="ticket-prize-name" class="ticket-prize">상품명</h2>
            <div class="ticket-desc">경품 수령처에서 이 화면을 보여주세요</div>
            
            <div class="ticket-divider"></div>
            
            <div class="ticket-code-label">교환 코드</div>
            <div id="ticket-code-val" class="ticket-code">JY-0000</div>
            
            <div class="ticket-bottom-row">
                <span id="ticket-date">2026.00.00 00:00</span>
                <span>유효 30분</span>
            </div>
        </div>

        <div class="warning-box">
            이 교환권은 <b>1인 1회</b>만 발급됩니다. <br>화면을 벗어나면 스탬프 수집 화면으로 되돌아갈 수 없습니다.
        </div>
        
        <button class="btn-home" onclick="window.location.href='index.html'">처음부터 다시 보기</button>
    </div>

    <!-- 자바스크립트 로직 -->
    <script>
        // theWheel 변수는 joayong.js에서 선언된 것을 사용합니다.
        let segmentsList = [];
        let currentStep = 1; 
        let finalPrizeName = "";

        document.addEventListener("DOMContentLoaded", async () => {
            try {
                const res = await fetch('/api/tour/available_prizes');
                const data = await res.json();
                
                if (data.success && data.prizes.length > 0) {
                    const activePrizes = data.prizes;
                    const colors = ['#FFF6B0', '#05FB73', '#00B3FF', '#FE73F3', '#FF9F40', '#8A2BE2'];
                    
                    for (let i = 0; i < 12; i++) {
                        const prize = activePrizes[i % activePrizes.length];
                        segmentsList.push({
                            'id': prize.id,
                            'fillStyle': colors[i % colors.length],
                            'text': prize.name
                        });
                    }

                    theWheel = new Winwheel({
                        'numSegments': 12,
                        'outerRadius': 135,
                        'innerRadius': 0,
                        'textFontSize': 16,            // 글자 크기는 16으로 시원하게 유지
                        'textFontFamily': 'Noto Sans KR',
                        'textFontWeight': 500,
                        'textFillStyle': '#111111',    // 텍스트 색상을 진한 검정색으로!
                        // ★ 테두리 관련 설정(Stroke)은 모두 삭제합니다.
                        'textMargin': 15,              
                        'textOrientation': 'vertical', 
                        'textAlignment': 'outer',
                        'segments': segmentsList,
                        'animation': {
                            'type': 'spinToStop',
                            'duration': 6,
                            'spins': 10,
                            'callbackFinished': showResultText // 애니메이션 종료 시 실행
                        }
                    });
                } else {
                    alert("현재 진행 가능한 경품이 없습니다.");
                    document.getElementById('btn-action').disabled = true;
                }
            } catch(e) {
                console.error("경품 목록 로드 에러", e);
            }
        });

        const btnAction = document.getElementById('btn-action');
        
        btnAction.addEventListener('click', async function() {
            // [STEP 1] 룰렛 돌리기
            if (currentStep === 1) {
                this.disabled = true; 
                
                try {
                    const response = await fetch('/api/tour/spin', { method: 'POST' });
                    const data = await response.json();

                    if (data.success) {
                        finalPrizeName = data.prizeName;
                        
                        const matchingIndexes = [];
                        for (let i = 0; i < segmentsList.length; i++) {
                            if (segmentsList[i].id === data.prizeId) {
                                matchingIndexes.push(i + 1);
                            }
                        }
                        
                        const targetSegment = matchingIndexes[Math.floor(Math.random() * matchingIndexes.length)];
                        const segmentAngle = 360 / 12;
                        const startAngle = (targetSegment - 1) * segmentAngle;
                        const stopAtAngle = startAngle + (Math.random() * (segmentAngle - 10) + 5);
                        
                        theWheel.animation.stopAngle = stopAtAngle;
                        theWheel.startAnimation();
                    } else {
                        alert(data.error);
                        this.disabled = false;
                    }
                } catch (e) {
                    alert("룰렛 통신 중 오류가 발생했습니다.");
                    this.disabled = false;
                }
            } 
            // [STEP 2] 교환권 화면으로 이동
            else if (currentStep === 2) {
                showTicketScreen();
            }
        });

        // ★ 룰렛이 멈췄을 때 실행되는 콜백 함수
        function showResultText() {
            // 1. 하단에 당첨 결과 텍스트 표시
            const resultText = document.getElementById('result-text');
            resultText.innerText = `${finalPrizeName} 당첨!`;
            resultText.classList.add('show');
            
            // 2. 버튼 텍스트와 색상을 쨍한 형광 초록색으로 변경
            btnAction.innerText = "교환권 받기";
            btnAction.style.background = "#00F260"; 
            btnAction.style.color = "#000";
            
            // 3. 상태 변경 및 버튼 활성화
            currentStep = 2;
            btnAction.disabled = false; 
        }

        // ★ 교환권 렌더링 및 화면 전환 함수
        function showTicketScreen() {
            const randomCode = "JY-" + Math.floor(1000 + Math.random() * 9000);
            
            const now = new Date();
            const dateStr = `${now.getFullYear()}.${String(now.getMonth()+1).padStart(2,'0')}.${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
            
            document.getElementById('ticket-prize-name').innerText = finalPrizeName;
            document.getElementById('ticket-code-val').innerText = randomCode;
            document.getElementById('ticket-date').innerText = dateStr;
            
            document.getElementById('screen-roulette').classList.add('hidden');
            document.getElementById('screen-ticket').classList.remove('hidden');
        }
    </script>
</body>
</html>
