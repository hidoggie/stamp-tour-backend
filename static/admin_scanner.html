<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>단종GO 관리자 경품 발급 스캐너</title>
    <!-- QR 스캐너 라이브러리 -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            margin: 0;
            padding: 0;
            background: #f0f2f5;
        }

        .header {
            background: #173357;
            color: white;
            padding: 20px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
        }

        .container {
            max-width: 500px;
            margin: 20px auto;
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        #reader {
            width: 100%;
            border-radius: 8px;
            overflow: hidden;
        }

        /* 스캔 성공 후 나타나는 패널 */
        #action-panel {
            display: none;
            text-align: center;
        }

        .user-id-box {
            background: #fef0f0;
            border: 1px solid #fad4d4;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .user-id-box h3 {
            margin: 0 0 5px 0;
            color: #e74c3c;
            font-size: 22px;
        }

        .user-id-box p {
            margin: 0;
            color: #e74c3c;
            font-size: 14px;
        }

        .ticket-btn {
            display: block;
            width: 100%;
            padding: 18px;
            margin: 12px 0;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            transition: transform 0.1s;
        }

        .ticket-btn:active {
            transform: scale(0.98);
        }

        .btn-type1 {
            background: #3498db;
        }

        .btn-type2 {
            background: #2ecc71;
        }

        .btn-type3 {
            background: #9b59b6;
        }

        .btn-type4 {
            background: #f39c12;
            color: #333;
        }

        .btn-cancel {
            background: #95a5a6;
            margin-top: 30px;
        }
    </style>
</head>

<body>

    <div class="header" style="display: flex; justify-content: space-between; align-items: center;">
        <span>🎁 단종GO 현장 경품 발급</span>
        <button onclick="executeLogout()"
            style="background: #e74c3c; color: white; border: none; padding: 5px 10px; border-radius: 5px; cursor: pointer; font-size: 14px;">로그아웃</button>
    </div>

    <div class="container">
        <!-- 카메라 스캐너 영역 -->
        <div id="scanner-area">
            <p style="text-align: center; color: #555; margin-bottom: 15px;">관광객의 화면에 표시된 <b>완주 QR코드</b>를 스캔해 주세요.</p>
            <div id="reader"></div>
        </div>

        <!-- 4종 발급 선택 영역 (스캔 성공 시 노출) -->
        <div id="action-panel">
            <div class="user-id-box">
                <p>스캔된 스탬프북 번호</p>
                <h3 id="scanned-id">YW-XXXX-XXXX</h3>
            </div>

            <h4 style="margin-bottom: 15px;">지급할 이용권을 선택해 주세요.</h4>

            <button class="ticket-btn btn-type1" onclick="issueTicket('이용권_A')">🎟️ 영상관 무료이용권 발급</button>
            <button class="ticket-btn btn-type2" onclick="issueTicket('이용권_B')">🎟️ 전시관 무료이용권 발급</button>
            <button class="ticket-btn btn-type3" onclick="issueTicket('이용권_C')">🎟️ 레이저서바이벌관 무료이용권 발급</button>
            <button class="ticket-btn btn-type4" onclick="issueTicket('이용권_D')">🎟️ 관광열차 무료이용권 발급</button>

            <button class="ticket-btn btn-cancel" onclick="resetScanner()">취소 및 다시 스캔하기</button>
        </div>
    </div>

    <script>
        let html5Qrcode;
        let currentPassportId = "";

        // 1. 스캐너 초기화 (카메라 권한 필요)
        async function initScanner() {
            // 기본 UI가 없는 Html5Qrcode 코어 클래스 사용
            if (!html5Qrcode) {
                html5Qrcode = new Html5Qrcode("reader");
            }

            try {
                // facingMode: "environment"를 통해 모바일 후면 카메라 강제 지정
                await html5Qrcode.start(
                    { facingMode: "environment" },
                    { fps: 10, qrbox: { width: 250, height: 250 } },
                    onScanSuccess,
                    onScanFailure
                );
            } catch (err) {
                console.error("카메라 초기화 에러:", err);
                alert("카메라를 실행할 수 없습니다.\n브라우저 설정에서 카메라 접근 권한을 허용해 주세요.");
            }
        }

        // 2. 스캔 성공 시
        async function onScanSuccess(decodedText, decodedResult) {
            // 우리가 만든 QR코드 접두어(DJGO_PRIZE:)인지 검사
            if (decodedText.startsWith("DJGO_PRIZE:")) {
                // 카메라 하드웨어 즉시 정지 (연속 스캔 방지)
                try { await html5Qrcode.stop(); } catch(e) {}
                
                currentPassportId = decodedText.split(":")[1];
                
                try {
                    // 🌟 서버에 이미 발급된 내역이 있는지 사전 검사 (API 호출)
                    const response = await fetch(`/api/admin/check_ticket/${currentPassportId}`);
                    const data = await response.json();
                    
                    if (data.already_issued) {
                        const typeName = data.ticket.ticket_type.replace('_', ' ');
                        const dateStr = new Date(data.ticket.issued_at).toLocaleString();
                        
                        alert(`❌ 이미 경품이 지급된 스탬프북입니다.\n\n[지급된 경품] ${typeName}\n[지급 일시] ${dateStr}`);
                        resetScanner(); // 경고창 닫으면 다시 스캐너 대기 상태로 자동 복귀
                        return; // 여기서 함수를 종료하여 아래 발급 버튼 화면을 띄우지 않음!
                    }
                    
                    // 발급 이력이 없을 때만 선택 화면 전환
                    document.getElementById("scanned-id").innerText = currentPassportId;
                    document.getElementById("scanner-area").style.display = "none";
                    document.getElementById("action-panel").style.display = "block";
                    
                } catch(err) {
                    console.error(err);
                    alert("발급 내역 확인 중 통신 오류가 발생했습니다.");
                    resetScanner();
                }
                
            } else {
                alert("단종GO 경품용 QR코드가 아닙니다.");
            }
        }

        function onScanFailure(error) {
            // 스캔 대기 중 발생하는 로그는 무시
        }

        // 3. 발급 버튼 클릭 시 서버로 전송
        async function issueTicket(ticketType) {
            if (!confirm(`[${ticketType}]을(를) 정말 발급하시겠습니까?\n발급 후에는 취소할 수 없습니다.`)) return;

            try {
                const response = await fetch('/api/admin/issue_ticket', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        passport_id: currentPassportId,
                        ticket_type: ticketType
                    })
                });

                const data = await response.json();

                if (data.success) {
                    alert("✅ 성공적으로 발급되었습니다!");
                    resetScanner(); // 발급 성공 후 다음 사람을 위해 스캐너 화면으로 복귀
                } else {
                    alert("❌ 발급 실패: " + data.error);
                }
            } catch (err) {
                console.error(err);
                alert("서버와 통신 중 오류가 발생했습니다.");
            }
        }

        // 4. 스캐너 초기 상태로 되돌리기
        function resetScanner() {
            currentPassportId = "";
            document.getElementById("action-panel").style.display = "none";
            document.getElementById("scanner-area").style.display = "block";
            initScanner(); // 스캐너(후면 카메라) 다시 실행
        }

        async function executeLogout() {
            if (!confirm("로그아웃 하시겠습니까?")) return;
            try {
                await fetch("/api/admin/logout", { method: "POST" });
                localStorage.removeItem("admin_role");
                window.location.href = "admin_login.html";
            } catch (e) {
                alert("로그아웃 처리 중 오류가 발생했습니다.");
            }
        }

        // 페이지 로드 시 스캐너 실행
        window.onload = initScanner;
    </script>
</body>

</html>
