<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>스탬프 미션</title>
    <style>
        /* --- 1. 기본 스타일 (우주 테마) --- */
        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            background-color: #1a1a2e; /* 깊은 우주색 */
            color: white;
            margin: 0;
            padding: 20px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 500px; /* 모바일 최적화 */
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        h1 {
            color: #e94560;
            margin-bottom: 5px;
            font-size: 1.8rem;
            text-shadow: 0 0 10px rgba(233, 69, 96, 0.5);
        }

        /* --- 2. 비디오 영역 --- */
        #video-container {
            width: 100%;
            background-color: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        video {
            width: 100%;
            display: block;
        }

        /* --- 3. 퀴즈 영역 --- */
        #quiz-container {
            background-color: #162447;
            padding: 25px;
            border-radius: 15px;
            border: 1px solid #1f4068;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        #question {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 20px;
            line-height: 1.4;
        }
        #options {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        #options button {
            padding: 15px;
            background-color: #1f4068;
            color: white;
            border: 2px solid #1f4068;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
            text-align: left;
        }
        #options button:hover {
            background-color: #e43f5a;
            border-color: #e43f5a;
            transform: translateY(-2px);
        }

        /* --- 4. 결과 및 메시지 영역 --- */
        #result-container {
            background-color: rgba(22, 36, 71, 0.9);
            padding: 20px;
            border-radius: 15px;
            border: 2px solid #4cd137; /* 성공 녹색 */
        }
        #result-message {
            font-size: 1.3rem;
            font-weight: bold;
            color: #4cd137;
            margin: 0;
        }

        /* --- 5. 스탬프 카드 (현황판) --- */
        #stamp-card-container {
            background-color: #162447;
            padding: 15px;
            border-radius: 15px;
            margin-top: 10px;
        }
        .stamp-card {
            display: grid;
            gap: 10px;
            /* grid-columns는 JS에서 설정됨 */
            background-size: cover;
            background-position: center;
            border-radius: 10px;
            padding: 10px;
        }
        .stamp-slot {
            aspect-ratio: 1/1;
            background-color: rgba(255,255,255,0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .stamp-slot img {
            width: 90%;
            height: 90%;
            object-fit: contain;
            opacity: 0.3; /* 기본 흐림 */
            transition: opacity 0.5s, transform 0.5s;
        }
        .stamp-slot.stamped img {
            opacity: 1; /* 획득 시 선명 */
            transform: scale(1.1);
            filter: drop-shadow(0 0 5px rgba(255, 215, 0, 0.8));
        }

        /* --- 6. 하단 버튼 --- */
        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        .btn {
            flex: 1;
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            color: white;
            transition: background 0.3s;
        }
        .btn-primary { background-color: #007bff; }
        .btn-secondary { background-color: #6c757d; }
        .btn:hover { opacity: 0.9; }

        /* 유틸리티 */
        .hidden { display: none !important; }

        /* --- 7. 축하 팝업 (Dialog) --- */
        dialog {
            background: #1a1a2e;
            color: white;
            border: 2px solid #e43f5a;
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        dialog::backdrop {
            background: rgba(0, 0, 0, 0.7);
        }
        dialog button {
            margin-top: 15px;
            padding: 10px 20px;
            background: #e43f5a;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="container">
        <div>
            <div style="font-size: 0.9rem; color: #aaa;">현재 위치</div>
            <h1 id="planet-title">행성 로딩 중...</h1>
        </div>

        <div id="video-container" class="hidden">
            <video id="video-player" controls playsinline>
                <source src="" type="video/mp4">
                브라우저가 비디오를 지원하지 않습니다.
            </video>
            <p style="font-size: 0.9em; color: #ccc; margin-top: 5px;">영상을 끝까지 시청하면 퀴즈가 나옵니다!</p>
        </div>

        <div id="quiz-container" class="hidden">
            <div style="color: #4cd137; font-weight: bold; margin-bottom: 10px;">Q. 퀴즈를 풀어보세요!</div>
            <div id="question">문제 로딩 중...</div>
            <div id="options">
                </div>
        </div>

        <div id="result-container" class="hidden">
            <div id="result-message">결과 메시지</div>
        </div>

        <div id="stamp-card-container" class="hidden">
            <div style="text-align: left; margin-bottom: 5px; font-weight: bold;">내 스탬프 현황</div>
            <div id="stamp-card" class="stamp-card"></div>
        </div>

        <div class="btn-group">
            <button id="photo-btn" class="btn btn-secondary hidden">📸 인증샷 찍기</button>
            <button id="map-btn" class="btn btn-primary">🗺️ 지도 화면으로</button>
        </div>
    </div>

    <dialog id="completion-dialog">
        <h3>🎉 축하합니다!</h3>
        <p>모든 스탬프를 모았습니다.</p>
        <button onclick="this.closest('dialog').close()">확인</button>
    </dialog>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        // --- 1. 전역 변수 및 요소 선언 ---
        const userId = localStorage.getItem('userId');
        const urlParams = new URLSearchParams(window.location.search);
        const eventId = urlParams.get('event_id');
        const planetId = urlParams.get('planet');
        
        let currentTheme = {};
        let currentStampData = {}; 
        
        const videoContainer = document.getElementById('video-container');
        const videoPlayer = document.getElementById('video-player');
        const quizContainer = document.getElementById('quiz-container');
        const questionEl = document.getElementById('question');
        const optionsEl = document.getElementById('options');
        const resultContainer = document.getElementById('result-container');
        const resultMessage = document.getElementById('result-message');
        const stampCardContainer = document.getElementById('stamp-card-container');
        const mapBtn = document.getElementById('map-btn');
        const photoBtn = document.getElementById('photo-btn');
        const Dialog = document.getElementById('completion-dialog'); // ID 수정됨

        // --- 2. 유령 사용자 방지 ---
        if (!userId) {
            alert("사용자 정보가 없습니다. 메인 지도 화면으로 돌아가주세요.");
            window.location.href = 'map.html';
            return;
        }

        // --- 3. 메인 초기화 함수 ---
        async function initPage() {
            if (!eventId || !planetId) {
                alert("잘못된 접근입니다.");
                window.location.href = 'map.html';
                return;
            }

            try {
                // 이벤트 테마 설정 가져오기
                const response = await fetch(`/api/event-theme/${eventId}`);
                if (!response.ok) throw new Error("이벤트 정보를 불러올 수 없습니다.");
                currentTheme = await response.json();

                // 현재 행성 데이터 찾기
                currentStampData = currentTheme.stamp_card_layout.stamps.find(s => s.id === planetId);
                
                if (!currentStampData) {
                    alert("해당 스탬프 정보를 찾을 수 없습니다.");
                    window.location.href = 'map.html';
                    return;
                }

                document.getElementById('planet-title').textContent = currentStampData.name;
                
                // 현재 사용자의 획득 상태 확인
                const collectedStamps = JSON.parse(localStorage.getItem('stamps')) || {};
                
                if (collectedStamps[planetId]) {
                    showAlreadyCollectedScreen();
                } else {
                    startQuizProcess();
                }

                renderStampCard();
                stampCardContainer.classList.remove('hidden');

            } catch (e) {
                console.error(e);
                alert("오류가 발생했습니다: " + e.message);
            }
        }

        // --- 4. 퀴즈 프로세스 시작 ---
        function startQuizProcess() {
            if (currentStampData.video) {
                videoContainer.classList.remove('hidden');
                videoPlayer.src = currentStampData.video;
                videoPlayer.load(); // 비디오 로드
                
                // 비디오 종료 이벤트
                videoPlayer.onended = () => {
                    videoContainer.classList.add('hidden');
                    showQuiz();
                };
            } else {
                videoContainer.classList.add('hidden');
                showQuiz();
            }
        }

        // --- 5. 퀴즈 화면 표시 ---
        function showQuiz() {
            quizContainer.classList.remove('hidden');
            
            const quiz = currentStampData.quiz;
            if (!quiz) {
                // 퀴즈 데이터가 없으면 바로 정답 처리 (예외 방지)
                processCorrectAnswer(); 
                return;
            }

            questionEl.textContent = quiz.question;
            optionsEl.innerHTML = '';
            
            quiz.options.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.textContent = opt;
                btn.onclick = () => checkAnswer(index, quiz.answer_index);
                optionsEl.appendChild(btn);
            });
        }

        // --- 6. 정답 체크 ---
        async function checkAnswer(selectedIndex, correctIndex) {
            if (selectedIndex === correctIndex) {
                await processCorrectAnswer();
            } else {
                alert("아쉬워요! 오답입니다. 다시 시도해보세요. 😅");
            }
        }

        // --- 7. 정답 처리 및 서버 기록 ---
        async function processCorrectAnswer() {
            quizContainer.classList.add('hidden');
            resultContainer.classList.remove('hidden');
            
            // 로컬 스토리지 저장
            const collectedStamps = JSON.parse(localStorage.getItem('stamps')) || {};
            collectedStamps[planetId] = true;
            localStorage.setItem('stamps', JSON.stringify(collectedStamps));

            // 서버 DB 저장
            try {
                await fetch('/api/collect-stamp', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userId, eventId, planetId })
                });
            } catch (e) {
                console.error("서버 기록 실패:", e);
            }

            resultMessage.textContent = `🎉 축하합니다! '${currentStampData.name}' 스탬프 획득!`;
            renderStampCard(); 
            checkFinalCompletion();
        }

        // --- 8. 전체 완료 여부 확인 ---
        function checkFinalCompletion() {
            const collectedStamps = JSON.parse(localStorage.getItem('stamps')) || {};
            
            // 현재 테마에 포함된 스탬프들 중 획득한 것의 개수
            const validCount = currentTheme.stamp_card_layout.stamps.filter(s => collectedStamps[s.id]).length;
            const totalRequired = currentTheme.stamp_card_layout.stamps.length;

            if (validCount >= totalRequired) {
                // 1. 전체 완료 시
                mapBtn.className = "btn btn-primary"; // 스타일 강조
                mapBtn.textContent = "🎁 룰렛 돌리러 가기";
                
                // 설문조사가 있으면 설문으로, 아니면 룰렛으로 (이벤트 설정에 따름)
                // 여기서는 편의상 룰렛으로 연결하되, 상위 로직에 따라 설문으로 갈 수도 있음
                // (이전 대화의 collect.html 로직 참조하여 필요시 수정 가능)
                mapBtn.onclick = () => { window.location.href = `game.html?event_id=${eventId}`; };
                
                showCompletionDialog();
            } else {
                // 2. 미완료 시
                mapBtn.textContent = "🗺️ 지도 화면으로";
                // DB의 main_page_url이 있으면 거기로, 없으면 map.html
                mapBtn.onclick = () => { window.location.href = currentTheme.main_page_url || 'map.html'; };
            }
        }

        // --- 9. 이미 획득 화면 ---
        function showAlreadyCollectedScreen() {
            videoContainer.classList.add('hidden');
            quizContainer.classList.add('hidden');
            resultContainer.classList.remove('hidden');
            resultMessage.textContent = "👌 이미 획득한 스탬프입니다.";
            checkFinalCompletion();
        }

        // --- 10. 스탬프 카드 렌더링 ---
        function renderStampCard() {
            const stampCardEl = document.getElementById('stamp-card');
            stampCardEl.innerHTML = '';
            const layout = currentTheme.stamp_card_layout;
            const collectedStamps = JSON.parse(localStorage.getItem('stamps')) || {};

            stampCardEl.style.backgroundImage = `url(${layout.background_image})`;
            stampCardEl.style.gridTemplateColumns = `repeat(${layout.grid_columns || 5}, 1fr)`;

            layout.stamps.forEach(stamp => {
                const slot = document.createElement('div');
                slot.className = 'stamp-slot';
                const img = document.createElement('img');
                
                if (collectedStamps[stamp.id]) {
                    img.src = stamp.image_acquired;
                    slot.classList.add('stamped');
                } else {
                    img.src = stamp.image_unacquired;
                }
                
                slot.appendChild(img);
                stampCardEl.appendChild(slot);
            });
        }

        function showCompletionDialog() {
            Dialog.showModal();
        }

        initPage();
    });
    </script>
</body>
</html>
