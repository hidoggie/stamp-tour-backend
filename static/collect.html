<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>스탬프 획득</title>
    <style>
      body {
          margin: 0;
          font-family: 'Segoe UI', sans-serif;
          background: url('logo.png') center center no-repeat;
          background-size: 300px auto;
          background-attachment: fixed;
          background-blend-mode: lighten;
          background-color: #f9f9f9;
        }
        
        /* --- 스탬프 카드 스타일 (stamptour.html에서 가져옴) --- */
        #stamp-card-container { 
            max-width: 600px;
            margin: 0 auto;
            padding: 2rem 1rem;
            text-align: center; 
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 2rem;
            color: #333;
        }

        .stamp-card {
            display: grid;
    
            gap: 1rem;
            padding: 15px;
            border-radius: 10px;
            max-width: 500px;
            margin: 0 auto;
            /* 배경 이미지와 열 개수는 JS로 설정됩니다. */
            background-size: cover;
            background-position: center;
        }

        .stamp-slot {
            background-color: rgba(255,255,255,0.2);
            border-radius: 10px;
            aspect-ratio: 1 / 1;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            margin: auto;
        }
        .stamp-slot img {
            max-width: 70%;
            max-height: 70%;
            opacity: 0.3; /* 획득 전 흐리게 */
            object-fit: contain;
        }
        .stamp-slot.stamped img {
            opacity: 1; /* 획득 후 선명하게 */
        }
        
        #index-btn {
            padding: 12px 25px;
            font-size: 1.1em;
            cursor: pointer;
            border-radius: 5px;
            border: none;
            color: white;
            background-color: #007bff;
            margin-top: 20px;
        }
        .hidden { display: none; }

        @media (max-width: 480px) {
           h1 {
              font-size: 1.5rem;
           }
        }
    </style>
</head>
<body>
    <div id="loading-state">
        <h1 id="loading-title">스탬프를 획득하는 중입니다...</h1>
        <p>잠시만 기다려주세요.</p>
        <div class="spinner"></div>
    </div>
    
    <div id="stamp-card-container" class="hidden">
        <h1 id="result-title">✅ 스탬프 획득 완료!</h1>
        <div id="stamp-card" class="stamp-card"></div>
        <button id="index-btn">🗺️ 메인 화면으로 돌아가기</button>
    </div>

    <script>
        // --- 3. 스탬프 카드 렌더링 함수 (stamptour.html과 동일) ---
        function renderStampCard(currentTheme, collectedStamps) {
            const stampCardEl = document.getElementById('stamp-card');
            stampCardEl.innerHTML = '';
            const layout = currentTheme.stamp_card_layout;
            if (!layout || !layout.stamps) {
                console.error("테마 설정에 'stamp_card_layout' 정보가 없습니다.");
                return;
            }
            stampCardEl.style.backgroundImage = `url(${layout.background_image})`;
            stampCardEl.style.gridTemplateColumns = `repeat(${layout.grid_columns || 5}, 1fr)`;

            layout.stamps.forEach(stamp => {
                const slot = document.createElement('div');
                slot.className = 'stamp-slot';
                const img = document.createElement('img');
                img.src = stamp.image;
                img.title = stamp.name;
                if (collectedStamps[stamp.id]) {
                    slot.classList.add('stamped');
                }
                slot.appendChild(img);
                stampCardEl.appendChild(slot);
            });
        }

        // --- 4. 메인 실행 로직 ---
        document.addEventListener('DOMContentLoaded', async () => {
            const loadingStateDiv = document.getElementById('loading-state');
            const stampCardContainer = document.getElementById('stamp-card-container');
            const resultTitle = document.getElementById('result-title');
            
            const urlParams = new URLSearchParams(window.location.search);
            const stampId = urlParams.get('stampId');
            const eventId = urlParams.get('event_id');
            let userId = localStorage.getItem('userId');

            if (!userId) {
                userId = crypto.randomUUID();
                localStorage.setItem('userId', userId);
                console.log(`collect.html에서 새로운 사용자 ID가 생성되었습니다: ${userId}`);
            }


            if (!stampId || !eventId) {
                alert("잘못된 접근입니다.");
                window.location.href = 'index.html';
                return;
            }

            try {
                // 5. 서버에서 이 이벤트의 테마 정보를 가져옴 (스탬프 카드를 그리기 위해)
                const themeResponse = await fetch(`/api/event-theme/${eventId}`);
                const currentTheme = await themeResponse.json();

                const collectedStamps = JSON.parse(localStorage.getItem('stamps')) || {};
                const alreadyCollected = collectedStamps[stampId];

                if (!alreadyCollected) {
                    // 6. 새 스탬프인 경우에만 서버에 기록 요청
                    const response = await fetch('/api/collect-stamp', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ userId, stampId, event_id: eventId })
                    });
                    if (!response.ok) throw new Error("서버 기록 실패");

                    // 7. localStorage에도 기록
                    collectedStamps[stampId] = true;
                    localStorage.setItem('stamps', JSON.stringify(collectedStamps));
                }
                
                // 8. 로딩 UI 숨기기
                loadingStateDiv.classList.add('hidden');

                // 9. 스탬프 카드 렌더링 및 표시
                resultTitle.textContent = alreadyCollected ? "👌 이미 획득한 스탬프입니다." : "✅ 스탬프 획득 완료!";
                renderStampCard(currentTheme, collectedStamps);
                stampCardContainer.classList.remove('hidden');

            } catch (error) {
                alert(`오류가 발생했습니다: ${error.message}`);
                window.location.href = 'index.html';
            }
        });

        // "메인 지도로" 버튼 이벤트
        document.getElementById('index-btn').onclick = () => {
            window.location.href = 'index.html';
        };
    </script>
</body>
</html>
