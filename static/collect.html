<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>스탬프 획득 중...</title>
    <style>
        body { font-family: sans-serif; text-align: center; background-color: #1a1a2e; color: white; padding-top: 50px; }
        .spinner { border: 8px solid #f3f3f3; border-top: 8px solid #3498db; border-radius: 50%; width: 60px; height: 60px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <h1>스탬프를 획득하는 중입니다...</h1>
    <p>잠시만 기다려주세요.</p>
    <div class="spinner"></div>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            let userId = localStorage.getItem('userId');
            if (!userId) {
                userId = crypto.randomUUID();
                localStorage.setItem('userId', userId);
                console.log(`collect.html에서 새로운 사용자 ID가 생성되었습니다: ${userId}`);
            }

            const urlParams = new URLSearchParams(window.location.search);
            const stampId = urlParams.get('stampId');
            const eventId = urlParams.get('event_id');
          
            // --- 1. 필수 정보 확인 ---
 
            if (!stampId || !eventId) {
                alert("잘못된 QR 코드입니다.");
                window.location.href = 'index.html';
                return;
            }

// --- 3. localStorage에 즉시 스탬프 기록 ---
        const collectedStamps = JSON.parse(localStorage.getItem('stamps')) || {};
        
        // 이미 획득한 스탬프인지 확인
        if (collectedStamps[stampId]) {
             document.querySelector('h1').textContent = "👌 이미 획득한 스탬프입니다.";
        } else {
            collectedStamps[stampId] = true;
            localStorage.setItem('stamps', JSON.stringify(collectedStamps));
            document.querySelector('h1').textContent = "✅ 스탬프 획득 완료!";
        }
        document.querySelector('p').textContent = "지도 화면으로 돌아갑니다.";
        
        try {
            // --- 4. 서버 DB에 스탬프 획득 사실 기록 ---
            // (서버의 upsertUserStamp 함수가 DB에 사용자를 생성/업데이트합니다)
            const response = await fetch('/api/collect-stamp', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    userId: userId, // 방금 생성/확인한 ID
                    stampId: stampId,
                    event_id: eventId 
                })
            });

            if (!response.ok) {
                throw new Error("서버에 스탬프를 기록하지 못했습니다.");
            }
            
            // --- 5. 성공 시, map.html로 복귀 ---
            setTimeout(() => {
                window.location.href = 'index.html';
            }, 1000); // 1초 후 이동

        } catch (error) {
            alert(`스탬프 획득에 실패했습니다: ${error.message}`);
            window.location.href = 'index.html';
        }
    });
</script>
</body>
</html>
