<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>조아용 스탬프 투어 종료 안내</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #eef5f4; /* 부드러운 배경색 */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            color: #333;
        }

        .notice-container {
            background: white;
            padding: 50px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(36, 87, 82, 0.1);
            max-width: 90%;
            width: 380px;
            border-top: 6px solid #3ca89e; /* 조아용 테마 포인트 컬러 */
            box-sizing: border-box;
        }

        .icon-box {
            font-size: 65px;
            margin-bottom: 20px;
            /* 가벼운 둥둥 뜨는 애니메이션 효과 */
            animation: float 2.5s ease-in-out infinite;
        }

        h1 {
            color: #245752;
            font-size: 24px;
            margin-top: 0;
            margin-bottom: 20px;
            line-height: 1.4;
            word-break: keep-all;
        }

        p {
            color: #555;
            font-size: 15px;
            line-height: 1.7;
            margin-bottom: 30px;
            word-break: keep-all;
        }

        .highlight {
            color: #2e8b82;
            font-weight: bold;
        }

        .footer-line {
            font-size: 13px;
            color: #999;
            border-top: 1px solid #f0f0f0;
            padding-top: 20px;
            margin-top: 10px;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-12px); }
            100% { transform: translateY(0px); }
        }
    </style>
</head>
<body>

    <div class="notice-container">
        <!-- 조아용을 연상시키는 이모지 또는 용 이모지 -->
        <div class="icon-box"><img src="./img/joa_id_6.png"></div>
        
        <h1>조아용 스탬프 투어가<br>성황리에 종료되었습니다!</h1>
        
        <p>
            이벤트 기간 동안 보내주신<br>
            많은 관심과 성원에 진심으로 감사드립니다.<br><br>
            준비된 모든 일정이 안전하게 마무리되었습니다.<br>
            앞으로도 <span class="highlight">조아용</span>과 함께하는<br>
            더욱 즐거운 이벤트로 다시 찾아뵙겠습니다!
        </p>
        
        <div class="footer-line">
            &copy; 2026 조아용 스탬프 투어
        </div>
    </div>

</body>
</html>
